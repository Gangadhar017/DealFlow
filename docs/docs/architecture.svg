<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1200" height="860" fill="#f7f8fc"/>
  <rect width="1200" height="64" fill="url(#hdr)"/>
  <text x="28" y="40" fill="#fff" font-size="24" font-weight="800">DealFlow360 — Architecture &amp; Data Model</text>
  <text x="1172" y="40" fill="#dcd9ff" font-size="13" text-anchor="end">Odoo Hackathon · one-page diagram</text>

  <!-- Browser layer -->
  <rect x="30" y="88" width="340" height="150" rx="14" fill="#fff" stroke="#c7cde4"/>
  <rect x="30" y="88" width="340" height="34" rx="14" fill="#101538"/>
  <text x="200" y="110" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">SALES REP WORKSPACE</text>
  <text x="46" y="140" font-size="12" fill="#374151">• Quotation builder + live margin</text>
  <text x="46" y="158" font-size="12" fill="#374151">• Upsell / cross-sell panel</text>
  <text x="46" y="176" font-size="12" fill="#374151">• Approval inbox · Fulfillment · Billing</text>
  <text x="46" y="194" font-size="12" fill="#374151">• Pipeline kanban</text>
  <text x="46" y="216" font-size="11" fill="#8a92ab">top menu: Quotations · Pipeline · Reload · Back-end · Close</text>

  <rect x="400" y="88" width="360" height="150" rx="14" fill="#fff" stroke="#c7cde4"/>
  <rect x="400" y="88" width="360" height="34" rx="14" fill="#101538"/>
  <text x="580" y="110" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">SALES BACKEND (CONFIG + REPORTING)</text>
  <text x="416" y="140" font-size="12" fill="#374151">• Products · variants · price lists (tier×currency)</text>
  <text x="416" y="158" font-size="12" fill="#374151">• Discount tiers · category ceilings · approval chain</text>
  <text x="416" y="176" font-size="12" fill="#374151">• Warehouses &amp; stock · subscription plans · upsell rules</text>
  <text x="416" y="194" font-size="12" fill="#374151">• Users &amp; roles · settings</text>
  <text x="416" y="216" font-size="11" fill="#8a92ab">Dashboard KPIs · Deal Health alerts · Reports → PDF/XLS/CSV</text>

  <rect x="790" y="88" width="380" height="150" rx="14" fill="#fff" stroke="#9db8e8"/>
  <rect x="790" y="88" width="380" height="34" rx="14" fill="#0e7490"/>
  <text x="980" y="110" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">CUSTOMER PORTAL — separate restricted surface</text>
  <text x="806" y="140" font-size="12" fill="#374151">• Portal login (customer role) OR per-quote magic link ?k=token</text>
  <text x="806" y="158" font-size="12" fill="#374151">• View live quotation · line-level comment / questions</text>
  <text x="806" y="176" font-size="12" fill="#374151">• Counter discount proposal · one-click confirm</text>
  <text x="806" y="194" font-size="12" fill="#374151">• Confirm beyond ceilings ⇒ auto re-enters approval flow</text>
  <text x="806" y="216" font-size="11" fill="#8a92ab">customers can only access their own company's quotes</text>

  <!-- arrows to API -->
  <line x1="200" y1="238" x2="500" y2="286" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="580" y1="238" x2="590" y2="286" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="980" y1="238" x2="690" y2="286" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- API bar -->
  <rect x="120" y="290" width="960" height="46" rx="10" fill="#eef0fe" stroke="#4f46e5"/>
  <text x="600" y="318" fill="#3730a3" font-size="14" font-weight="700" text-anchor="middle">REST API — Express · scrypt+session cookies · role middleware (admin / manager / finance / salesrep / customer)</text>

  <line x1="600" y1="336" x2="600" y2="366" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Engines layer -->
  <rect x="60" y="370" width="1080" height="196" rx="14" fill="#fff" stroke="#c7cde4"/>
  <rect x="60" y="370" width="1080" height="32" rx="14" fill="#312e81"/>
  <text x="600" y="391" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">BUSINESS LOGIC ENGINES (src/engines.js) — rules in application code, nothing faked</text>

  <rect x="80" y="414" width="196" height="66" rx="10" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="178" y="436" font-size="13" font-weight="700" text-anchor="middle" fill="#5b21b6">PRICING</text>
  <text x="178" y="454" font-size="11" text-anchor="middle" fill="#374151">tier+currency price lists</text>
  <text x="178" y="470" font-size="11" text-anchor="middle" fill="#374151">variants · plan pricing</text>

  <rect x="296" y="414" width="216" height="66" rx="10" fill="#fef2f2" stroke="#f87171"/>
  <text x="404" y="436" font-size="13" font-weight="700" text-anchor="middle" fill="#991b1b">BLENDED RISK ⚠</text>
  <text x="404" y="454" font-size="11" text-anchor="middle" fill="#374151">allowed = min(tier, category)</text>
  <text x="404" y="470" font-size="11" text-anchor="middle" fill="#374151">worst + ½×others → routing</text>

  <rect x="532" y="414" width="186" height="66" rx="10" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="625" y="436" font-size="13" font-weight="700" text-anchor="middle" fill="#155e75">UPSELL</text>
  <text x="625" y="454" font-size="11" text-anchor="middle" fill="#374151">co-purchase + promo boost</text>
  <text x="625" y="470" font-size="11" text-anchor="middle" fill="#374151">min-margin floor · Δ margin</text>

  <rect x="738" y="414" width="186" height="66" rx="10" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="831" y="436" font-size="13" font-weight="700" text-anchor="middle" fill="#166534">WAREHOUSE SPLIT</text>
  <text x="831" y="454" font-size="11" text-anchor="middle" fill="#374151">min shipments → min cost</text>
  <text x="831" y="470" font-size="11" text-anchor="middle" fill="#374151">backorder + consolidation</text>

  <rect x="944" y="414" width="176" height="66" rx="10" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="1032" y="436" font-size="13" font-weight="700" text-anchor="middle" fill="#92400e">HYBRID BILLING</text>
  <text x="1032" y="454" font-size="11" text-anchor="middle" fill="#374151">one-time + recurring cycles</text>
  <text x="1032" y="470" font-size="11" text-anchor="middle" fill="#374151">daily proration · credit notes</text>

  <rect x="296" y="492" width="420" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="506" y="514" font-size="13" font-weight="700" text-anchor="middle" fill="#334155">DEAL HEALTH ENGINE</text>
  <text x="506" y="532" font-size="11" text-anchor="middle" fill="#374151">stalled deals · discount anomaly vs rep baseline ×1.5 · delivery slippage → nudge / escalate</text>

  <rect x="738" y="492" width="382" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="929" y="514" font-size="13" font-weight="700" text-anchor="middle" fill="#334155">AUDIT TRAIL</text>
  <text x="929" y="532" font-size="11" text-anchor="middle" fill="#374151">every approval / edit / negotiation logged with user · timestamp · reason</text>

  <line x1="600" y1="566" x2="600" y2="596" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- DB layer -->
  <rect x="140" y="600" width="920" height="120" rx="14" fill="#0d1128"/>
  <text x="600" y="628" fill="#fff" font-size="15" font-weight="800" text-anchor="middle">SQLite (node:sqlite · WAL) — 17 tables, seeded demo company</text>
  <g font-size="11.5" fill="#aab1cf">
    <text x="170" y="656">users · sessions · customers(tier,currency)</text>
    <text x="170" y="676">products · variants · categories(ceiling) · price_lists</text>
    <text x="170" y="696">discount_tiers · approval_rules · warehouses · stock_levels</text>
    <text x="620" y="656">quotations ─ lines · approvals · negotiations · fulfillment_splits</text>
    <text x="620" y="676">billing_schedule · invoices(one_time|recurring|credit_note) · payments</text>
    <text x="620" y="696">subscription_plans · product_plans · upsell_rules · audit_log · alerts · settings</text>
  </g>

  <!-- Status machine strip -->
  <rect x="60" y="744" width="1080" height="92" rx="14" fill="#fff" stroke="#c7cde4"/>
  <text x="600" y="770" font-size="13" font-weight="800" text-anchor="middle" fill="#101532">QUOTATION STATUS MACHINE — governed, then negotiated, then fulfilled</text>
  <g font-size="11.5" font-weight="600">
    <rect x="90" y="786" width="74" height="26" rx="13" fill="#eef1f7"/><text x="127" y="803" text-anchor="middle" fill="#475069">draft</text>
    <rect x="186" y="786" width="120" height="26" rx="13" fill="#fdf3e3"/><text x="246" y="803" text-anchor="middle" fill="#b45309">pending manager</text>
    <rect x="328" y="786" width="114" height="26" rx="13" fill="#fdf3e3"/><text x="385" y="803" text-anchor="middle" fill="#b45309">pending finance</text>
    <rect x="464" y="786" width="86" height="26" rx="13" fill="#e8f7ee"/><text x="507" y="803" text-anchor="middle" fill="#166534">approved</text>
    <rect x="574" y="786" width="70" height="26" rx="13" fill="#e0f2fe"/><text x="609" y="803" text-anchor="middle" fill="#0369a1">sent</text>
    <rect x="668" y="786" width="106" height="26" rx="13" fill="#fef3c7"/><text x="721" y="803" text-anchor="middle" fill="#b45309">negotiating ↺</text>
    <rect x="794" y="786" width="96" height="26" rx="13" fill="#e0f2fe"/><text x="842" y="803" text-anchor="middle" fill="#0369a1">confirmed</text>
    <rect x="910" y="786" width="96" height="26" rx="13" fill="#e0f2fe"/><text x="958" y="803" text-anchor="middle" fill="#0369a1">fulfilling</text>
    <rect x="1026" y="786" width="94" height="26" rx="13" fill="#e8f7ee"/><text x="1073" y="803" text-anchor="middle" fill="#166534">fulfilled</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.4">
    <line x1="164" y1="799" x2="184" y2="799" marker-end="url(#arr)"/>
    <line x1="306" y1="799" x2="326" y2="799" marker-end="url(#arr)"/>
    <line x1="442" y1="799" x2="462" y2="799" marker-end="url(#arr)"/>
    <line x1="550" y1="799" x2="572" y2="799" marker-end="url(#arr)"/>
    <line x1="644" y1="799" x2="666" y2="799" marker-end="url(#arr)"/>
    <line x1="774" y1="792" x2="792" y2="792" marker-end="url(#arr)"/>
    <line x1="890" y1="799" x2="908" y2="799" marker-end="url(#arr)"/>
    <line x1="1006" y1="799" x2="1024" y2="799" marker-end="url(#arr)"/>
  </g>
  <text x="721" y="828" font-size="10.5" text-anchor="middle" fill="#dc2626">customer confirms beyond ceilings → auto re-enters "pending manager"</text>
</svg>
