<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#714B67"/>
    </marker>
  </defs>
  <rect width="920" height="560" fill="#FAFAFB"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#4E2E5E">DealFlow360 v2 — React · Node.js · PostgreSQL</text>

  <!-- Browser / React -->
  <rect x="40" y="60" width="840" height="110" rx="10" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="460" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#714B67">BROWSER — React SPA (Vite build, zero UI libraries)</text>
  <rect x="60" y="98" width="255" height="56" rx="7" fill="#F3EDF6"/>
  <text x="187" y="120" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4E2E5E">Back-office app</text>
  <text x="187" y="138" text-anchor="middle" font-size="10" fill="#666">quotations · approvals · fulfillment</text>
  <text x="187" y="151" text-anchor="middle" font-size="10" fill="#666">billing · commissions · reports · config</text>
  <rect x="333" y="98" width="255" height="56" rx="7" fill="#E5F0F0"/>
  <text x="460" y="120" text-anchor="middle" font-size="11.5" font-weight="600" fill="#017E84">Odoo-style design system</text>
  <text x="460" y="138" text-anchor="middle" font-size="10" fill="#666">navbar menus · KPI chips · status pills</text>
  <text x="460" y="151" text-anchor="middle" font-size="10" fill="#666">list/kanban views · SVG charts</text>
  <rect x="606" y="98" width="255" height="56" rx="7" fill="#FBF0D9"/>
  <text x="733" y="120" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9C6F07">Customer portal</text>
  <text x="733" y="138" text-anchor="middle" font-size="10" fill="#666">magic-link quotes · comments · counter</text>
  <text x="733" y="151" text-anchor="middle" font-size="10" fill="#666">one-click confirm → auto re-approval</text>

  <line x1="460" y1="170" x2="460" y2="200" stroke="#714B67" stroke-width="2" marker-end="url(#arr)"/>

  <!-- API -->
  <rect x="120" y="202" width="680" height="64" rx="10" fill="#714B67"/>
  <text x="460" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">REST API — Express 5 (role-gated: admin · manager · finance · salesrep · customer)</text>
  <text x="460" y="246" text-anchor="middle" font-size="10.5" fill="#E9DFEE">/auth /quotations /approvals /upsell /split /billing /invoices /commissions /reports /portal/*</text>

  <line x1="460" y1="266" x2="460" y2="296" stroke="#714B67" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Engines -->
  <rect x="40" y="298" width="840" height="150" rx="10" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="460" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#714B67">BUSINESS ENGINES (src/engines.js)</text>
  <g font-size="10" fill="#333">
    <rect x="60" y="336" width="185" height="46" rx="7" fill="#F7F8FA"/><text x="152" y="354" text-anchor="middle" font-weight="600">Blended-risk router</text><text x="152" y="370" text-anchor="middle" fill="#666">min(tier,category) ceilings →</text><text x="152" y="380" text-anchor="middle" fill="#666">manager → finance chain</text>
    <rect x="257" y="336" width="185" height="46" rx="7" fill="#F7F8FA"/><text x="349" y="354" text-anchor="middle" font-weight="600">Upsell engine</text><text x="349" y="370" text-anchor="middle" fill="#666">co-score + promo, margin-guard,</text><text x="349" y="380" text-anchor="middle" fill="#666">live margin delta</text>
    <rect x="454" y="336" width="185" height="46" rx="7" fill="#F7F8FA"/><text x="546" y="354" text-anchor="middle" font-weight="600">Warehouse split</text><text x="546" y="370" text-anchor="middle" fill="#666">greedy consolidation, fewest</text><text x="546" y="380" text-anchor="middle" fill="#666">shipments, backorders</text>
    <rect x="651" y="336" width="208" height="46" rx="7" fill="#F7F8FA"/><text x="755" y="354" text-anchor="middle" font-weight="600">Hybrid billing</text><text x="755" y="370" text-anchor="middle" fill="#666">one-time + recurring, daily proration,</text><text x="755" y="380" text-anchor="middle" fill="#666">policy credit notes</text>
    <rect x="60" y="392" width="290" height="46" rx="7" fill="#E5F0F0"/><text x="205" y="410" text-anchor="middle" font-weight="600" fill="#017E84">Commission engine</text><text x="205" y="426" text-anchor="middle" fill="#666">on invoice payment → best rule (product›category›rep›team›all)</text><text x="205" y="437" text-anchor="middle" fill="#666">% / fixed / margin-tier → draft·confirm·approve·settle</text>
    <rect x="362" y="392" width="185" height="46" rx="7" fill="#F7F8FA"/><text x="454" y="410" text-anchor="middle" font-weight="600">Deal health</text><text x="454" y="426" text-anchor="middle" fill="#666">stalled · discount anomaly vs</text><text x="454" y="437" text-anchor="middle" fill="#666">rep baseline · slippage</text>
    <rect x="559" y="392" width="140" height="46" rx="7" fill="#F7F8FA"/><text x="629" y="410" text-anchor="middle" font-weight="600">Exports</text><text x="629" y="426" text-anchor="middle" fill="#666">CSV · XLS · PDF</text><text x="629" y="437" text-anchor="middle" fill="#666">(dependency-free)</text>
    <rect x="711" y="392" width="148" height="46" rx="7" fill="#F7F8FA"/><text x="785" y="410" text-anchor="middle" font-weight="600">Audit trail</text><text x="785" y="426" text-anchor="middle" fill="#666">every action logged,</text><text x="785" y="437" text-anchor="middle" fill="#666">per-quote timeline</text>
  </g>

  <line x1="460" y1="448" x2="460" y2="478" stroke="#714B67" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Database -->
  <rect x="170" y="480" width="580" height="58" rx="10" fill="#33627F"/>
  <text x="460" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">PostgreSQL — dealflow360 (pg pool, 21 tables)</text>
  <text x="460" y="524" text-anchor="middle" font-size="10.5" fill="#C9DAE6">users · customers · quotations · lines · approvals · splits · billing · invoices · payments · commissions · rules · alerts · audit · settings</text>
</svg>
